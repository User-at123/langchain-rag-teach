<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库问答</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 16px;
    font-weight: 600;
    flex-shrink: 0;
  }
  header small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .bot  { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .hint { align-self: center; color: var(--muted); font-size: 12px; padding: 6px 0; text-align: center; }
  footer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>RAG 知识库问答<small>检索增强生成 · 文本 + 表格</small></header>

  <main id="chat">
    <div class="hint">
      试试：所有客户的行业有哪些<br>
      每个公司的诞生时间　华信银行用什么产品
    </div>
  </main>

  <footer>
    <input id="q" placeholder="输入你的问题…" autocomplete="off">
    <button id="send">发送</button>
  </footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('q');
const btn = document.getElementById('send');

// 会话 ID：localStorage 持久化，刷新页面后多轮记忆仍延续（第 9 步）
let sessionId = localStorage.getItem('rag_session_id');
if (!sessionId) {
  sessionId = 's-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  localStorage.setItem('rag_session_id', sessionId);
}

function add(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  add(q, 'user');
  input.value = '';

  // 占位气泡，等待结果（检索+生成约需 10~20 秒，让用户有预期）
  const pending = document.createElement('div');
  pending.className = 'msg bot';
  pending.textContent = '正在检索知识库并生成回答（约 10~20 秒）…';
  chat.appendChild(pending);
  chat.scrollTop = chat.scrollHeight;
  btn.disabled = true;

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: sessionId })
    });
    const data = await res.json();
    if (data.session_id) {  // 首次提问后端可能新生成 ID，沿用并持久化
      sessionId = data.session_id;
      localStorage.setItem('rag_session_id', sessionId);
    }
    pending.textContent = res.ok ? data.answer : ('出错了：' + (data.detail || res.status));
  } catch (e) {
    pending.textContent = '网络错误：' + e;
  }
  btn.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

btn.onclick = ask;
input.onkeydown = function (e) { if (e.key === 'Enter') ask(); };
</script>
</body>
</html>
